<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ישיבת יראנו ניסים · עשרה כיווני עיצוב</title>
<style>
  :root{--bg:#0A1B2E;--raised:#10243B;--text:#EDE6D8;--soft:#A9BACC;--faint:#7B90A6;--rule:#1E3E63;--gold:#E9C063;
        --serif:"Frank Ruehl CLM","FrankRuehl","David","Noto Serif Hebrew","Times New Roman",serif;--sans:"Assistant","Segoe UI","Arial Hebrew","Noto Sans Hebrew","Helvetica Neue",system-ui,sans-serif;}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{width:min(100% - 2.5rem,72rem);margin-inline:auto;padding-block:clamp(2.5rem,7vh,4.5rem)}
  .logo{width:clamp(9rem,18vw,12rem);margin-bottom:2rem}
  h1{font-family:var(--serif);font-size:clamp(1.9rem,4.6vw,3rem);line-height:1.1;margin:0 0 .8rem;letter-spacing:-.02em}
  .sub{color:var(--soft);max-width:40rem;margin:0 0 2.75rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:1.25rem}
  .card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--raised);
        border:1px solid var(--rule);border-radius:2px;overflow:hidden;transition:border-color .18s ease,transform .18s ease}
  .card:hover{border-color:var(--gold);transform:translateY(-2px)}
  .thumb{display:block;aspect-ratio:16/10;overflow:hidden;background:#06121F}
  .thumb img{width:100%;height:100%;object-fit:cover;opacity:.82}
  .card:hover .thumb img{opacity:1}
  .meta{display:flex;flex-direction:column;gap:.15rem;padding:.9rem 1.05rem 1.1rem}
  .meta strong{font-family:var(--serif);font-size:1.25rem;font-weight:700}
  .meta span{font-size:.85rem;color:var(--faint)}
  footer{border-top:1px solid var(--rule);margin-top:3.5rem;padding-top:1.5rem;color:var(--faint);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="img/logo-dark.png" alt="יראנו ניסים" />
  <h1>עשרה כיווני עיצוב</h1>
  <p class="sub">אותו תוכן, אותו טופס, עשר שפות ויזואליות. לחצו על כל אחד כדי לראות את הדף המלא — ובתחתית כל דף יש סרגל למעבר מהיר בין הכיוונים.</p>
  <div class="grid">
    <a class="card" href="v10.html">
      <span class="thumb"><img src="img/mikdash.jpg" alt="" loading="lazy" /></span>
      <span class="meta"><strong>מקדש</strong><span>אבן ירושלמית · אינדיגו</span></span>
    </a>
  </div>
  <footer>ישיבת יראנו ניסים · בראשות הרב רפאל רובין שליט״א · נתניה</footer>
</div>
</body>
</html>
